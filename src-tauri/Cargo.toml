[package]
name = "carrier"
version = "0.1.0"
description = "A minimal mail client"
authors = ["Carrier"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "carrier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-auth-session = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
